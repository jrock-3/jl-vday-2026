name: Update Timer

on:
  workflow_dispatch:
    inputs:
      email:
        required: true
        type: string
      reason_index:
        required: true
        type: string
      unlock_time:
        required: true
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update state
        id: state
        env:
          CURRENT: ${{ secrets.VITE_TIMER_STATES }}
          EMAIL: ${{ inputs.email }}
          INDEX: ${{ inputs.reason_index }}
          UNLOCK: ${{ inputs.unlock_time }}
        run: |
          NEW=$(node -e "
            const s = JSON.parse(process.env.CURRENT || '{}');
            s[process.env.EMAIL] = { 
              index: parseInt(process.env.INDEX), 
              unlockAt: parseInt(process.env.UNLOCK) 
            };
            console.log(JSON.stringify(s));
          ")
          echo "json=$NEW" >> $GITHUB_OUTPUT

      - uses: gliech/create-github-secret-action@v1
        with:
          name: VITE_TIMER_STATES
          value: ${{ steps.state.outputs.json }}
          pa_token: ${{ secrets.TIMER_UPDATE_PAT }}

      - uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: CD.yml
          token: ${{ secrets.TIMER_UPDATE_PAT }}
